<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codelix - Coming Soon</title>
    <meta name="description" content="Codelix - Something amazing is coming soon. Stay tuned!">
    <meta name="keywords" content="software development, custom software, IT solutions, web development, mobile app development, technology consulting">
    <meta name="author" content="Codelix">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/images/logo.svg" type="image/svg+xml">
    <meta property="og:title" content="Codelix - Coming Soon">
    <meta property="og:description" content="Something amazing is coming soon. Stay tuned!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://codelix.com">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --dark-bg: #0f172a;
            --light-text: #f1f5f9;
            --accent-color: #ec4899;
        }

        body {
            font-family: 'Space Grotesk', 'Josefin Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--light-text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(99, 102, 241, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: pulse 8s ease-in-out infinite;
            z-index: 0;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -200px;
            right: -200px;
        }

        .orb2 {
            width: 500px;
            height: 500px;
            background: var(--secondary-color);
            bottom: -250px;
            left: -250px;
            animation-delay: 2s;
        }

        .orb3 {
            width: 300px;
            height: 300px;
            background: var(--accent-color);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        /* Logo animation */
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: logoFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.5));
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Title animations */
        .title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #6366f1, #ec4899, #8b5cf6);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite, fadeInUp 1s ease;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #94a3b8;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        /* Graphics Container */
        .graphics-container {
            margin: 3rem 0;
            position: relative;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        .rocket-svg {
            width: 200px;
            height: 200px;
            animation: rocketFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(99, 102, 241, 0.4));
        }

        @keyframes rocketFloat {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }
            50% {
                transform: translateY(-30px) rotate(5deg);
            }
        }

        .fire {
            animation: fireFlicker 0.3s ease-in-out infinite alternate;
        }

        .fire1 { animation-delay: 0s; }
        .fire2 { animation-delay: 0.1s; }
        .fire3 { animation-delay: 0.2s; }

        @keyframes fireFlicker {
            0% {
                opacity: 1;
                transform: scaleY(1);
            }
            100% {
                opacity: 0.8;
                transform: scaleY(1.1);
            }
        }

        /* Floating Code Elements */
        .code-element {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(99, 102, 241, 0.6);
            animation: codeFloat 4s ease-in-out infinite;
        }

        .code-1 {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
        }

        .code-2 {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .code-3 {
            bottom: 20%;
            left: 15%;
            animation-delay: 2s;
        }

        .code-4 {
            bottom: 15%;
            right: 20%;
            animation-delay: 3s;
        }

        @keyframes codeFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
                opacity: 0.8;
            }
        }

        /* Contact section */
        .contact-section {
            animation: fadeInUp 1s ease 0.6s backwards;
            margin-bottom: 2rem;
        }

        .contact-title {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #cbd5e1;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 1rem 2rem;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--light-text);
            min-width: 280px;
        }

        .contact-item:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(99, 102, 241, 0.4);
        }

        .contact-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* Social links */
        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            animation: fadeInUp 1s ease 0.8s backwards;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--light-text);
        }

        .social-link:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateY(-5px) rotate(360deg);
            box-shadow: 0 5px 30px rgba(99, 102, 241, 0.5);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo {
                width: 80px;
                height: 80px;
            }

            .graphics-container {
                height: 250px;
            }

            .rocket-svg {
                width: 150px;
                height: 150px;
            }

            .code-element {
                font-size: 1.2rem;
            }

            .contact-item {
                min-width: 250px;
                padding: 0.875rem 1.5rem;
            }

            .orb1, .orb2, .orb3 {
                width: 250px;
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .graphics-container {
                height: 200px;
            }

            .rocket-svg {
                width: 120px;
                height: 120px;
            }

            .code-element {
                font-size: 1rem;
            }

            .contact-item {
                min-width: 220px;
                font-size: 0.9rem;
            }
        }

        /* Loading animation */
        .loading-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #ec4899, #8b5cf6);
            background-size: 200% 100%;
            animation: loading 2s ease-in-out infinite;
            width: 0%;
        }

        @keyframes loading {
            0% {
                width: 0%;
                background-position: 0% 50%;
            }
            50% {
                width: 100%;
                background-position: 100% 50%;
            }
            100% {
                width: 100%;
                background-position: 0% 50%;
            }
        }
    </style>
</head>

    <!-- Loading Bar -->

        <div class="loading-progress"></div>

    <script>
        // Particle Animation
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
